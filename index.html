<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9b2c2c">
<link rel="apple-touch-icon" href="icon-512.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Love Dare Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #9b2c2c;
      --primary-light: #fff5f5;
      --primary-hover: #7b1d1d;
      --accent: #c05621;
      --bg: #f7fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #2d3748;
      --text-muted: #718096;
      --success: #2f855a;
      --success-bg: #f0fff4;
      --gold: #d69e2e;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #7b1d1d, #4a1515);
      color: white;
      padding: 40px 20px 30px;
      text-align: center;
      position: relative;
      box-shadow: var(--shadow-lg);
    }
    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    header p {
      font-size: 0.95rem;
      opacity: 0.9;
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }

    .container {
      max-width: 900px;
      margin: -25px auto 0;
      padding: 0 16px;
    }

    /* Stats Card */
    .dashboard-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      align-items: center;
      margin-bottom: 24px;
    }
    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #edf2f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.5s ease;
    }
    .stat-digits {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Top Actions & Sync Bar */
    .sync-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn:hover { background: #edf2f7; }
    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }

    /* Filter & Search */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }
    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      outline: none;
      font-size: 0.9rem;
      background: var(--surface);
    }
    .filter-pills {
      display: flex;
      gap: 6px;
    }
    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
    }
    .pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Day Cards */
    .days-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .day-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
    }
    .day-card.completed {
      border-left: 6px solid var(--success);
    }
    .day-card-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .day-card-header:hover {
      background: #fafafa;
    }
    .day-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .day-badge {
      width: 44px;
      height: 44px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      line-height: 1;
    }
    .day-badge span { font-size: 1.1rem; }
    .day-card.completed .day-badge {
      background: var(--success-bg);
      color: var(--success);
    }
    .day-title-box h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .day-scripture-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }
    .day-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-check {
      font-size: 1.3rem;
      color: var(--border);
    }
    .day-card.completed .status-check {
      color: var(--success);
    }

    /* Card Expanded Content */
    .day-card-body {
      display: none;
      padding: 0 20px 22px;
      border-top: 1px solid #edf2f7;
      animation: fadeIn 0.2s ease;
    }
    .day-card.expanded .day-card-body { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .verse-quote {
      margin: 16px 0;
      padding: 12px 16px;
      background: #fdf6ec;
      border-left: 4px solid var(--gold);
      border-radius: 4px;
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      color: #744210;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--primary);
      margin-top: 16px;
      margin-bottom: 6px;
    }
    .dare-box {
      background: var(--primary-light);
      border: 1px solid #feb2b2;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.92rem;
      font-weight: 500;
      color: #742a2a;
    }

    .journal-box {
      margin-top: 16px;
    }
    .journal-prompt {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .journal-textarea {
      width: 100%;
      min-height: 110px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      resize: vertical;
      background: #fff;
    }
    .journal-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(155, 44, 44, 0.1);
    }

    .action-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 12px;
    }
    .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .custom-checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      cursor: pointer;
    }

    /* Modal for Cloud Sync */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 1.3rem; margin-bottom: 12px; color: var(--primary); }
    .modal p { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px; }
    .modal textarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.7rem; }
      .dashboard-card { grid-template-columns: 1fr; }
      .controls-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

  <header>
    <h1>THE LOVE DARE</h1>
    <p>A 40-Day Journey of Unconditional Love</p>
  </header>

  <div class="container">
    <!-- Dashboard Stats -->
    <div class="dashboard-card">
      <div class="progress-box">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-weight: 700; font-size: 0.9rem;">Your Progress</span>
          <span id="progress-pct" style="font-weight: 700; color: var(--primary);">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
          <strong id="completed-count">0</strong> of 40 Dares Completed
        </div>
      </div>

      <div class="sync-bar">
        <button class="btn" onclick="openSyncModal('export')">📤 Export / Sync</button>
        <button class="btn" onclick="openSyncModal('import')">📥 Import Backup</button>
        <button class="btn btn-primary" onclick="printJournal()">🖨️ Print Journal</button>
      </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="controls-row">
      <input type="text" id="search-input" class="search-input" placeholder="Search dares, titles, scriptures..." oninput="filterDays()" />
      <div class="filter-pills">
        <button class="pill active" onclick="setFilter('all', this)">All (40)</button>
        <button class="pill" onclick="setFilter('pending', this)">In Progress</button>
        <button class="pill" onclick="setFilter('completed', this)">Completed</button>
      </div>
    </div>

    <!-- Days Grid -->
    <div id="days-container" class="days-grid"></div>
  </div>

  <!-- Sync Modal -->
  <div id="sync-modal" class="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Device Sync & Backup</h2>
      <p id="modal-desc">Copy your sync code and paste it on your other device (phone or PC) to instantly transfer all progress and notes.</p>
      <textarea id="sync-data-box" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="closeSyncModal()">Cancel</button>
        <button id="modal-action-btn" class="btn btn-primary" onclick="handleModalAction()">Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <script>

        prompt: "If you prayed together, what was the experience like? What did you learn from hearing each other pray?"

        prompt: "What hesitations did you have in writing this letter? How did this process deepen your resolve?"

      {

        scripture: "Ruth 1:16",

        dare: "Write out a renewal of your vows and place them in your home. Reaffirm that your marriage is a lifelong, unbreakable covenant before God.",
        prompt: "What has God revealed to you throughout the Love Dare? How has your view of your marriage and your spouse changed?"

    // Local Storage State Management
    let appState = JSON.parse(localStorage.getItem('love_dare_state')) || {};
    let currentFilter = 'all';

    function saveState() {
      localStorage.setItem('love_dare_state', JSON.stringify(appState));
      updateDashboard();
    }

    function toggleDayCard(dayNum) {
      const card = document.getElementById(`day-card-${dayNum}`);
      card.classList.toggle('expanded');
    }

    function toggleComplete(dayNum, isChecked) {
      if (!appState[dayNum]) appState[dayNum] = {};
      appState[dayNum].completed = isChecked;
      if (isChecked && !appState[dayNum].completedAt) {
        appState[dayNum].completedAt = new Date().toISOString();
      }
      const card = document.getElementById(`day-card-${dayNum}`);
      if (isChecked) {
        card.classList.add('completed');
      } else {
        card.classList.remove('completed');
      }
      saveState();
      filterDays();
    }

    function saveJournalNote(dayNum, text) {
      if (!appState[dayNum]) appState[dayNum] = {};
      appState[dayNum].notes = text;
      saveState();
    }

    function updateDashboard() {
      let completedCount = 0;
      for (let i = 1; i <= 40; i++) {
        if (appState[i]?.completed) completedCount++;
      }
      const pct = Math.round((completedCount / 40) * 100);
      document.getElementById('completed-count').textContent = completedCount;
      document.getElementById('progress-pct').textContent = `${pct}%`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function renderDays() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      LOVE_DARE_DATA.forEach(d => {
        const state = appState[d.day] || {};
        const isDone = !!state.completed;
        const note = state.notes || '';

        const card = document.createElement('div');
        card.className = `day-card ${isDone ? 'completed' : ''}`;
        card.id = `day-card-${d.day}`;
        card.dataset.day = d.day;
        card.dataset.completed = isDone;

        card.innerHTML = `
          <div class="day-card-header" onclick="toggleDayCard(${d.day})">
            <div class="day-header-left">
              <div class="day-badge">DAY<span>${d.day}</span></div>
              <div class="day-title-box">
                <h3>${d.title}</h3>
                <div class="day-scripture-tag">${d.scripture}</div>
              </div>
            </div>
            <div class="day-status">
              <span class="status-check">${isDone ? '✓' : '○'}</span>
            </div>
          </div>
          <div class="day-card-body">
            <div class="verse-quote">"${d.verse}"</div>
            
            <div class="section-label">Today's Dare</div>
            <div class="dare-box">${d.dare}</div>

            <div class="journal-box">
              <div class="section-label">Journal & Reflections</div>
              <div class="journal-prompt">${d.prompt}</div>
              <textarea 
                class="journal-textarea" 
                placeholder="Write your reflection, discoveries, and prayers for today..."
                oninput="saveJournalNote(${d.day}, this.value)">${note}</textarea>
            </div>

            <div class="action-footer">
              <label class="custom-checkbox">
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleComplete(${d.day}, this.checked)">
                Mark Day ${d.day} as Completed
              </label>
              ${state.completedAt ? `<span style="font-size:0.75rem; color:var(--text-muted);">Done on ${new Date(state.completedAt).toLocaleDateString()}</span>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      updateDashboard();
    }

    // Search and Filter Logic
    function filterDays() {
      const query = document.getElementById('search-input').value.toLowerCase();
      LOVE_DARE_DATA.forEach(d => {
        const card = document.getElementById(`day-card-${d.day}`);
        const state = appState[d.day] || {};
        const isDone = !!state.completed;

        const matchesSearch = d.title.toLowerCase().includes(query) || 
                              d.dare.toLowerCase().includes(query) || 
                              d.scripture.toLowerCase().includes(query) ||
                              d.verse.toLowerCase().includes(query) ||
                              (state.notes && state.notes.toLowerCase().includes(query));

        let matchesFilter = true;
        if (currentFilter === 'completed') matchesFilter = isDone;
        if (currentFilter === 'pending') matchesFilter = !isDone;

        card.style.display = (matchesSearch && matchesFilter) ? 'block' : 'none';
      });
    }

    function setFilter(type, el) {
      currentFilter = type;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      filterDays();
    }

    // Sync Modal Handling (JSON Sync Code)
    let modalMode = 'export';
    function openSyncModal(mode) {
      modalMode = mode;
      const modal = document.getElementById('sync-modal');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');
      const box = document.getElementById('sync-data-box');
      const actionBtn = document.getElementById('modal-action-btn');

      modal.classList.add('active');
      if (mode === 'export') {
        title.textContent = "Multi-Device Sync Code";
        desc.textContent = "Copy this sync code and paste it on your phone or PC under 'Import Backup':";
        box.value = JSON.stringify(appState, null, 2);
        box.readOnly = true;
        actionBtn.textContent = "Copy to Clipboard";
      } else {
        title.textContent = "Import Progress & Notes";
        desc.textContent = "Paste the sync code from your other device here and click Restore:";
        box.value = "";
        box.readOnly = false;
        actionBtn.textContent = "Restore & Merge Progress";
      }
    }

    function closeSyncModal() {
      document.getElementById('sync-modal').classList.remove('active');
    }

    function handleModalAction() {
      const box = document.getElementById('sync-data-box');
      if (modalMode === 'export') {
        box.select();
        navigator.clipboard.writeText(box.value);
        alert('Sync code copied to clipboard! Open this app on your other device and choose "Import Backup".');
        closeSyncModal();
      } else {
        try {
          const parsed = JSON.parse(box.value.trim());
          if (typeof parsed === 'object') {
            appState = { ...appState, ...parsed };
            saveState();
            renderDays();
            filterDays();
            alert('Progress and journal notes successfully restored and synced!');
            closeSyncModal();
          } else {
            throw new Error('Invalid format');
          }
        } catch (err) {
          alert('Invalid sync code format. Please ensure you pasted the entire code.');
        }
      }
    }

    function printJournal() {
      window.print();
    }

    // Initialize App
    window.onload = () => {
      renderDays();
    };
  </script>

      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered!'))
        .catch(err => console.error('Service Worker registration failed: ', err));
    });
  }
</script>
